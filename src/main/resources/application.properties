spring.application.name=vittae

spring.datasource.url=jdbc:mysql://localhost:3306/vittae?createDatabaseIfNotExist=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=ifsp
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate / Jpa
spring.jpa.hibernate.ddl-auto=update
spring.jpa.defer-datasource-initialization=true
# Mude para never após a primeira execução, ou use o DDL-AUTO para recriar o banco sempre.
spring.sql.init.mode=never

# Mostra SQL no console
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Dialeto do MySQL
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

server.port=8082